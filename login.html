<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Traveloop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="traveloop/src/main/resources/static/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--wanderlog-light-blue, #EBF8FF) 0%, var(--wanderlog-light-gray, #F3F4F6) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--wanderlog-red, #FF5A5F);
            margin-bottom: 8px;
        }
        
        .logo p {
            font-size: 16px;
            color: #666;
        }
        
        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            border: 2px solid var(--wanderlog-border, #E5E7EB);
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 500;
            color: var(--wanderlog-dark-gray, #1F2937);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }
        
        .google-btn:hover {
            background: var(--wanderlog-light-gray, #F3F4F6);
            border-color: var(--wanderlog-red, #FF5A5F);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 90, 95, 0.15);
        }
        
        .google-btn svg {
            width: 24px;
            height: 24px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #999;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        
        .divider span {
            padding: 0 16px;
        }
        
        .email-form {
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ff5c5c;
            box-shadow: 0 0 0 3px rgba(255, 92, 92, 0.1);
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px 24px;
            background: var(--wanderlog-red, #FF5A5F);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            background: var(--wanderlog-dark-red, #E53E3E);
            box-shadow: 0 8px 20px rgba(255, 90, 95, 0.4);
        }
        
        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        
        .back-link a {
            color: var(--wanderlog-red, #FF5A5F);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link a:hover {
            color: var(--wanderlog-dark-red, #E53E3E);
            text-decoration: underline;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        
        .demo-credentials {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .demo-credentials p {
            font-size: 13px;
            color: #0369a1;
            font-weight: 500;
            margin-bottom: 12px;
        }
        
        .demo-credentials .credentials-list {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .demo-credentials .credentials-list strong {
            color: #0369a1;
        }
        
        .demo-btn {
            width: 100%;
            padding: 12px 24px;
            background: #0ea5e9;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .demo-btn:hover {
            background: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Traveloop</h1>
            <p>Sign in to continue</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <button class="google-btn" onclick="handleGoogleSignIn()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>
        
        <div class="divider">
            <span>or</span>
        </div>
        
        <div class="demo-credentials">
            <p>Try Demo Login</p>
            <div class="credentials-list">
                <strong>Email:</strong> demo@traveloop.com<br>
                <strong>Password:</strong> demo123456
            </div>
            <button type="button" class="demo-btn" onclick="useDemoCredentials()">Use Demo Credentials</button>
        </div>
        
        <form class="email-form" onsubmit="handleEmailLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="submit-btn">Sign In</button>
        </form>
        
        <div class="back-link">
            <a href="frontend/home.html">← Back to Home</a>
        </div>
    </div>
    
    <script>
        // Demo Credentials
        const DEMO_EMAIL = 'demo@traveloop.com';
        const DEMO_PASSWORD = 'demo123456';
        
        function useDemoCredentials() {
            document.getElementById('email').value = DEMO_EMAIL;
            document.getElementById('password').value = DEMO_PASSWORD;
            document.getElementById('email').focus();
        }
        
        // Google Sign-In Configuration
        const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // Replace with your actual Google Client ID
        
        function handleGoogleSignIn() {
            // This will trigger Google OAuth popup
            // For production, you need to:
            // 1. Create a project in Google Cloud Console
            // 2. Enable Google Sign-In API
            // 3. Create OAuth 2.0 credentials
            // 4. Add your domain to authorized origins
            
            alert('Google Sign-In will be configured with your Google Client ID.\n\nTo enable Google Sign-In:\n1. Go to console.cloud.google.com\n2. Create a project\n3. Enable Google Sign-In API\n4. Create OAuth 2.0 credentials\n5. Replace YOUR_GOOGLE_CLIENT_ID in the code');
            
            // Actual implementation would look like:
            // window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${encodeURIComponent(window.location.origin + '/callback')}&response_type=code&scope=email profile`;
        }
        
        function handleEmailLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Check if demo credentials are used
            if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
                alert(` Demo Login Successful!\n\nEmail: ${email}\n\nWelcome to Traveloop! Redirecting to main page...`);
                // Redirect to main.html
                window.location.href = 'http://127.0.0.1:5000/main.html';
                return;
            }
            
            // Here you would send the credentials to your backend
            // For now, just show a success message
            alert(`Email login submitted!\nEmail: ${email}\n\nIn production, this would authenticate with your backend server.`);
        }
    </script>
</body>
</html>
